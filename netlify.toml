[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The project URL is public and intentionally appears in the browser bundle.
  # Keep credential scanning enabled for service-role and email provider keys.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/enquiries"
  to = "/.netlify/functions/create-enquiry"
  status = 200

[[redirects]]
  from = "/api/enquiries/:id/whatsapp"
  to = "/.netlify/functions/enquiry-whatsapp?id=:id"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
